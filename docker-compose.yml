services:
  redis:
    image: redis/redis-stack:7.4.0-v7
    container_name: wikipulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight (debug UI)
    volumes:
      - redis-data:/data
    command: ["redis-stack-server", "--save", "60", "1", "--dir", "/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestor:
    build: .
    image: wikipulse-backend:latest
    container_name: wikipulse-ingestor
    restart: unless-stopped
    command: ["python", "-m", "wikipulse.ingestor"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      WIKIMEDIA_URL: "${WIKIMEDIA_URL:-https://stream.wikimedia.org/v2/stream/recentchange}"
      USER_AGENT: "${USER_AGENT:-WikiPulse/1.0 (contact@example.com)}"
      DETECT_EDITS: "${DETECT_EDITS:-true}"
      DETECT_IMAGES: "${DETECT_IMAGES:-false}"
      SUMMARIZE: "${SUMMARIZE:-false}"
      DETECT_EXCLUDE_BOTS: "${DETECT_EXCLUDE_BOTS:-true}"
      DETECT_ONLY_ANON: "${DETECT_ONLY_ANON:-false}"
      SAMPLE_RATE: "${SAMPLE_RATE:-1.0}"
      STREAM_MAXLEN: "${STREAM_MAXLEN:-200}"
      FLUSH_INTERVAL_S: "${FLUSH_INTERVAL_S:-1.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      redis:
        condition: service_healthy

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: wikipulse-llm
    restart: unless-stopped
    # Universal CPU default: serves Gemma 4 E4B mobile QAT (UD-Q2_K_XL) + multimodal
    # projector via llama.cpp. Automatically downloads and caches weights in `llm-cache`.
    # For NVIDIA CUDA acceleration with Q4 QAT, layer `docker-compose.gpu.yml`.
    command:
      - "--hf-repo"
      - "${LLM_HF_REPO:-unsloth/gemma-4-E4B-it-qat-mobile-GGUF:UD-Q2_K_XL}"
      - "--alias"
      - "${LLM_MODEL:-gemma-4-e4b-qat}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--threads"
      - "${LLM_THREADS:-8}"
      - "--ctx-size"
      - "${LLM_CTX_SIZE:-4096}"
      - "--parallel"
      - "${LLM_PARALLEL:-1}"
      - "--cache-reuse"
      - "256"
      - "--jinja"
      - "--reasoning"
      - "off"
    environment:
      LLAMA_CACHE: "/models/cache"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - llm-cache:/models/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

  analyzer:
    build: .
    image: wikipulse-backend:latest
    container_name: wikipulse-analyzer
    restart: unless-stopped
    command: ["python", "-m", "wikipulse.analyzer"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      USER_AGENT: "${USER_AGENT:-WikiPulse/1.0 (contact@example.com)}"
      MAX_FETCHES_PER_MIN: "${MAX_FETCHES_PER_MIN:-180}"
      ANALYZER_CONCURRENCY: "${ANALYZER_CONCURRENCY:-1}"
      DETECT_EDITS: "${DETECT_EDITS:-true}"
      DETECT_IMAGES: "${DETECT_IMAGES:-false}"
      SUMMARIZE: "${SUMMARIZE:-false}"
      LLM_URL: "http://llm:8000/v1/chat/completions"
      LLM_MODEL: "${LLM_MODEL:-gemma-4-e4b-qat}"
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: .
    image: wikipulse-backend:latest
    container_name: wikipulse-api
    restart: unless-stopped
    command: ["uvicorn", "wikipulse.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: wikipulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
  llm-cache:
