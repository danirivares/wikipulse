server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline non-visual security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compress static text/JS/CSS/SVG assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Re-resolve Docker service DNS dynamically so recreating `api` never leaves
    # nginx pinned to a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events: disable buffering and compression so frames flush immediately.
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        chunked_transfer_encoding on;
    }

    # Content-hashed Vite assets are safe to cache immutably for 1 year.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Revalidate HTML shell without blocking browser bfcache (avoid no-store).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
